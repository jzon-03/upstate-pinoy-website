<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Upstate Pinoy</title>
  <script>
    // GitHub Pages SPA redirect solution
    // Store the path and redirect to index.html with path in query string
    sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
    location.replace(location.origin + '/?redirect=' + encodeURIComponent(location.pathname + location.search + location.hash));
  </script>
</head>
<body>
</body>
</html>
